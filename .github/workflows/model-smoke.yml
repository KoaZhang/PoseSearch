name: Real model smoke

on:
  workflow_dispatch:
  push:
    branches: [feat/v0.2-real-inference]
    paths:
      - models.lock.json
      - scripts/resolve_models.py
      - scripts/smoke_real_inference.py
      - src/posesearch/inference/**
      - src/posesearch/pipeline.py
      - src/posesearch/preprocess.py
      - pyproject.toml
      - .github/workflows/model-smoke.yml

jobs:
  real-model-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Resolve pinned models and print exact hashes
        run: |
          python scripts/resolve_models.py --models-dir .models --update-lock
          cat models.lock.json
      - name: Install inference dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[inference]'
      - name: Download pinned RTMLib demo image
        run: |
          curl --fail --location --retry 3 \
            -o /tmp/rtmlib-demo.jpg \
            https://raw.githubusercontent.com/Tau-J/rtmlib/03a1693e59e4f7cd84582c0fb30459b3bf18ad42/demo.jpg
      - name: Run real YOLOX-tiny + RTMPose-s inference
        run: |
          python scripts/smoke_real_inference.py \
            --image /tmp/rtmlib-demo.jpg \
            --models-dir .models \
            --lock models.lock.json \
            --overlay /tmp/posesearch-overlay.jpg
      - uses: actions/upload-artifact@v4
        with:
          name: real-model-smoke-overlay
          path: /tmp/posesearch-overlay.jpg
