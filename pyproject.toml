[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "posesearch"
version = "0.2.0"
description = "CPU-first 2D body-pose similarity service for image libraries"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi==0.128.2",
  "uvicorn==0.48.0",
  "pydantic==2.13.4",
  "numpy==2.3.5",
  "Pillow==12.3.0",
  "opencv-python-headless==4.13.0.92",
  "PyYAML==6.0.3",
  "python-multipart==0.0.29",
]

[project.optional-dependencies]
inference = [
  "onnxruntime==1.29.0",
  "rtmlib @ git+https://github.com/Tau-J/rtmlib.git@03a1693e59e4f7cd84582c0fb30459b3bf18ad42",
]
dev = [
  "pytest==9.0.2",
  "httpx==0.28.1",
]

[project.scripts]
posesearch = "posesearch.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
posesearch = ["migrations/*.sql"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]
